# PR checks
#
#   check-format    ──┐
#   check-build     ──┼── run in parallel, block PR merges on failure
#   check-extension ──┘
#
name: PR

on:
  pull_request:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/run-ormolu@v17
        with:
          # keep in sync with ORMOLU_VER in Dockerfile
          version: "0.8.0.2"

  check-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: build-artifacts
          cache-from: type=gha,scope=build-amd64
          cache-to: type=gha,mode=max,scope=build-amd64

  check-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gcl-vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run compile
      - run: pnpm run test:node
